<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — TaskFlow</title><link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand login-brand" th:href="@{/login}"><span class="brand-mark">T</span><span>TaskFlow<small>PERSONAL WORKSPACE</small></span></a>
    <span class="eyebrow">ACCOUNT RECOVERY</span>
    <h1>Choose a new password</h1>
    <p class="subheading">Use at least 10 characters. Reset links expire after 30 minutes and can be used once.</p>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>
    <form method="post" th:action="@{/reset-password}" class="task-form login-form">
      <input type="hidden" name="token" th:value="${token}">
      <label>New password<input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="72" placeholder="At least 10 characters"></label>
      <label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="72" placeholder="Enter it again"></label>
      <button type="submit" class="primary-button login-submit">Reset password</button>
    </form>
    <p class="login-footnote"><a th:href="@{/login}">Back to sign in</a></p>
  </main>
</body>
</html>
