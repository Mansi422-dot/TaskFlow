<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password — TaskFlow</title><link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand login-brand" th:href="@{/login}"><span class="brand-mark">T</span><span>TaskFlow<small>PERSONAL WORKSPACE</small></span></a>
    <span class="eyebrow">ACCOUNT RECOVERY</span>
    <h1>Forgot your password?</h1>
    <p class="subheading">Enter the email address associated with your account. If it matches an account and email delivery is configured, we'll send a reset link.</p>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>
    <div class="flash success" th:if="${param.submitted}" th:text="${message} ?: 'If an account exists for that email and email delivery is configured, a reset link will be sent shortly.'"></div>
    <form method="post" th:action="@{/forgot-password}" class="task-form login-form">
      <label>Email<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
      <button type="submit" class="primary-button login-submit">Send reset link</button>
    </form>
    <p class="login-footnote"><a th:href="@{/login}">Back to sign in</a></p>
  </main>
</body>
</html>
