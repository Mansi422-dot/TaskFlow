spring.application.name=TaskFlow
server.port=8080
server.address=0.0.0.0
# Local file-backed database. Keep ./data/taskflow.mv.db with the project to preserve tasks.
spring.datasource.url=jdbc:h2:file:./data/taskflow;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.h2.console.enabled=false
server.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# User accounts are stored in the application database; no default account is configured.

# Optional SMTP email delivery. For Gmail, use an App Password, never your normal account password.
spring.mail.host=${TASKFLOW_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${TASKFLOW_SMTP_PORT:587}
spring.mail.username=${TASKFLOW_MAIL_USERNAME:}
spring.mail.password=${TASKFLOW_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
taskflow.mail.from=${TASKFLOW_MAIL_FROM:}
taskflow.mail.base-url=${TASKFLOW_BASE_URL:http://localhost:8080}

# Authentication rate limiting
taskflow.rate-limit.enabled=true
taskflow.rate-limit.window-seconds=900
taskflow.rate-limit.login=10
taskflow.rate-limit.register=5
taskflow.rate-limit.forgot-password=3
taskflow.rate-limit.reset-password=10
